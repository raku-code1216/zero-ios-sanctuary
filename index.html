<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero (0) Sanctuary Prototype</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandDark: '#030303',
                        brandLime: '#DEFF9A',
                        brandGray: '#121212',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;600&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030303;
            user-select: none;
            -webkit-user-select: none;
        }
        .fade-in {
            animation: fadeIn 0.6s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-brandDark text-white h-screen flex flex-col justify-between items-center overflow-hidden relative">

    <!-- Canvas 背景粒子 -->
    <canvas id="canvas" class="absolute inset-0 z-0 pointer-events-none"></canvas>

    <!-- 頂部資訊欄 -->
    <header class="relative z-10 w-full px-6 py-6 flex justify-between items-center border-b border-white/5 bg-brandDark/80 backdrop-blur-md">
        <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-brandLime animate-pulse"></span>
            <span class="text-xs font-semibold tracking-widest text-brandLime">ZERO (0) SANCTUARY</span>
        </div>
        <!-- 倒數計時器 -->
        <div id="timerContainer" class="hidden flex items-center gap-2 bg-white/5 border border-white/10 px-3 py-1.5 rounded-full">
            <span class="text-[10px] text-white/50 tracking-widest uppercase">Safe Time:</span>
            <span id="timerDisplay" class="text-xs font-mono text-brandLime font-semibold">05:00</span>
        </div>
    </header>

    <!-- 主要交互體驗區域 -->
    <main class="relative z-10 flex-1 w-full max-w-md flex flex-col justify-center items-center px-6 text-center">

        <!-- 狀態 1：初始呼吸與崩塌按鈕 -->
        <div id="stateBreathing" class="flex flex-col items-center gap-8 fade-in">
            <div id="ringOuter" class="w-52 h-52 border border-brandLime/30 rounded-full flex items-center justify-center transition-all duration-500">
                <div id="ringInner" class="w-44 h-44 border border-brandLime/60 rounded-full flex items-center justify-center transition-all duration-500">
                    <button id="mainBtn" 
                            class="w-36 h-36 bg-brandLime/5 hover:bg-brandLime/10 border border-brandLime rounded-full flex items-center justify-center transition-all duration-300 active:scale-95 cursor-pointer"
                            onmousedown="startHold()" onmouseup="cancelHold()" onmouseleave="cancelHold()"
                            ontouchstart="startHold(event)" ontouchend="cancelHold(event)">
                        <span class="text-5xl font-extralight text-brandLime select-none">0</span>
                    </button>
                </div>
            </div>
            
            <div class="flex flex-col items-center gap-2">
                <p id="instructionText" class="text-xs text-white/50 tracking-widest uppercase">長按圓環 1.5 秒進入 5 分鐘微避難</p>
                <div id="progressTrack" class="w-32 h-1 bg-white/10 rounded-full overflow-hidden opacity-0 transition-opacity">
                    <div id="progressBar" class="h-full w-0 bg-brandLime transition-all duration-75"></div>
                </div>
            </div>
        </div>

        <!-- 狀態 2：5分鐘避難中 (Active Refuge) -->
        <div id="stateActiveRefuge" class="hidden flex-col items-center gap-6 fade-in">
            <div class="w-16 h-16 border border-brandLime/40 rounded-full flex items-center justify-center animate-pulse">
                <span class="text-brandLime text-xl">⚪</span>
            </div>
            <p id="oracleMsg" class="text-lg font-light text-white/90 leading-relaxed max-w-xs">
                世界已留在門外。<br>在這裡，好好享受這 5 分鐘的絕對寂靜。
            </p>
            
            <!-- 測試專用：快進按鈕 -->
            <button onclick="fastForwardTimer()" class="mt-8 px-4 py-2 border border-white/10 hover:border-brandLime/40 bg-white/5 rounded-full text-[10px] text-white/40 hover:text-brandLime uppercase tracking-widest transition-all">
                ⚡ [測試功能] 模擬 5 分鐘結束
            </button>
        </div>

        <!-- 狀態 3：5分鐘結束與溫柔升級卡片 (HK$5 Upgrade) -->
        <div id="stateCompleted" class="hidden flex-col items-center gap-6 fade-in bg-brandGray border border-white/10 p-8 rounded-3xl shadow-2xl max-w-sm">
            <div class="text-brandLime text-3xl font-extralight">✨</div>
            <div>
                <h3 class="text-lg font-light tracking-wide text-white">5 分鐘平靜已完成</h3>
                <p class="text-xs text-white/50 mt-2 leading-relaxed">
                    世界已準備好重新擁抱你。<br>你可以選擇回歸現實，或解鎖無限時長避難。
                </p>
            </div>

            <!-- HK$5 訂閱卡片 -->
            <div class="w-full bg-brandDark border border-brandLime/30 p-4 rounded-2xl flex flex-col gap-3 text-left my-2">
                <div class="flex justify-between items-baseline">
                    <span class="text-xs font-semibold text-brandLime tracking-wider uppercase">深層無限避難</span>
                    <span class="text-sm font-bold text-white">HK$5 <span class="text-[10px] font-normal text-white/50">/ 月</span></span>
                </div>
                <ul class="text-[11px] text-white/60 space-y-1">
                    <li>✓ 自定義 15min / 30min / 無限時長</li>
                    <li>✓ 100% 純淨零廣告與騷擾</li>
                    <li>✓ 寂靜地圖專屬金暈光點</li>
                </ul>
            </div>

            <!-- 按鈕組 -->
            <div class="w-full flex flex-col gap-3">
                <button onclick="subscribeSuccess()" class="w-full py-3 bg-brandLime text-brandDark rounded-full text-xs font-bold tracking-widest uppercase hover:bg-white transition-all shadow-lg">
                    以 HK$5/月 升級無限時長
                </button>
                <button onclick="resetApp()" class="w-full py-2.5 bg-transparent border border-white/10 text-white/50 hover:text-white rounded-full text-xs tracking-widest uppercase transition-all">
                    回歸現實 (結束體驗)
                </button>
            </div>
        </div>

    </main>

    <!-- 頁腳說明 -->
    <footer class="relative z-10 w-full py-4 text-center text-[10px] text-white/30 tracking-widest uppercase border-t border-white/5 bg-brandDark/80">
        Zero Protocol • Privacy First • No Ads Forever
    </footer>

    <!-- JavaScript 交互邏輯 -->
    <script>
        // Canvas 背景粒子繪製
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5 + 0.5,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3
                });
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#DEFF9A';
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(animateCanvas);
        }

        initCanvas();
        animateCanvas();
        window.addEventListener('resize', initCanvas);

        // 交互邏輯與計時器管理
        let holdTimer;
        let holdProgress = 0;
        let safeTimer;
        let secondsRemaining = 300; // 5 分鐘 (300 秒)

        function startHold(e) {
            if (e) e.preventDefault();
            document.getElementById('progressTrack').classList.remove('opacity-0');
            document.getElementById('instructionText').innerText = "壓縮雜訊中...";
            
            holdProgress = 0;
            holdTimer = setInterval(() => {
                holdProgress += 10;
                document.getElementById('progressBar').style.width = holdProgress + '%';
                if (holdProgress >= 100) {
                    clearInterval(holdTimer);
                    triggerSanctuaryStart();
                }
            }, 100);
        }

        function cancelHold(e) {
            if (e) e.preventDefault();
            clearInterval(holdTimer);
            if (holdProgress < 100) {
                document.getElementById('progressTrack').classList.add('opacity-0');
                document.getElementById('progressBar').style.width = '0%';
                document.getElementById('instructionText').innerText = "長按圓環 1.5 秒進入 5 分鐘微避難";
            }
        }

        function triggerSanctuaryStart() {
            document.getElementById('stateBreathing').classList.add('hidden');
            document.getElementById('stateActiveRefuge').classList.remove('hidden');
            document.getElementById('stateActiveRefuge').classList.add('flex');
            document.getElementById('timerContainer').classList.remove('hidden');

            secondsRemaining = 300;
            updateTimerDisplay();
            safeTimer = setInterval(() => {
                secondsRemaining--;
                updateTimerDisplay();
                if (secondsRemaining <= 0) {
                    clearInterval(safeTimer);
                    triggerTimeUp();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsRemaining / 60);
            const secs = secondsRemaining % 60;
            document.getElementById('timerDisplay').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function fastForwardTimer() {
            clearInterval(safeTimer);
            secondsRemaining = 0;
            updateTimerDisplay();
            triggerTimeUp();
        }

        function triggerTimeUp() {
            document.getElementById('stateActiveRefuge').classList.add('hidden');
            document.getElementById('timerContainer').classList.add('hidden');
            
            document.getElementById('stateCompleted').classList.remove('hidden');
            document.getElementById('stateCompleted').classList.add('flex');
        }

        function subscribeSuccess() {
            alert("感謝支持 Zero (0) 守護者計劃！\n已成功解鎖無限時長深層避難權益。");
            resetApp();
        }

        function resetApp() {
            clearInterval(safeTimer);
            document.getElementById('stateCompleted').classList.add('hidden');
            document.getElementById('stateActiveRefuge').classList.add('hidden');
            document.getElementById('timerContainer').classList.add('hidden');
            
            document.getElementById('stateBreathing').classList.remove('hidden');
            document.getElementById('progressTrack').classList.add('opacity-0');
            document.getElementById('progressBar').style.width = '0%';
            document.getElementById('instructionText').innerText = "長按圓環 1.5 秒進入 5 分鐘微避難";
        }
    </script>
</body>
</html>
